kotlin.code.style=official

# JA: the GitHub repository the app checks for new versions, written as username/repo-name (for example
# yourname/ja). The repository has to be public. Leave it empty to turn the in-app updater off.
ja.githubRepo=MiseryCoder/JA-App

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
